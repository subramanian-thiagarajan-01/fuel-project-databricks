resources:
  jobs:
    fuel_project_streaming_google_reviews_ingestion:
      name: fuel_project_streaming_google_reviews_ingestion
      trigger:
        pause_status: UNPAUSED
        periodic:
          interval: 1
          unit: HOURS
      tasks:
        - task_key: stream_google_reviews_bronze
          notebook_task:
            notebook_path: /Workspace/Users/subbuthiagumsi@outlook.com/fuel-project-databricks/fuel-project-dbw/src/notebooks/bronze/raw_bronze_google_reviews
            source: WORKSPACE
        - task_key: stream_google_reviews_silver
          depends_on:
            - task_key: stream_google_reviews_bronze
          notebook_task:
            notebook_path: /Workspace/Users/subbuthiagumsi@outlook.com/fuel-project-databricks/fuel-project-dbw/src/notebooks/silver/bronze_silver_google_reviews
            source: WORKSPACE
        - task_key: gold_fact_reviews
          depends_on:
            - task_key: stream_google_reviews_silver
          notebook_task:
            notebook_path: /Workspace/Users/subbuthiagumsi@outlook.com/fuel-project-databricks/fuel-project-dbw/src/notebooks/gold/fact_google_reviews
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
